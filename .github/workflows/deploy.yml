# =============================================================================
# Fastest Finger Quiz — CI/CD Pipeline
# =============================================================================
# Single workflow per ADR-005: infra → build + test → deploy
#
# Required GitHub Repository Secrets & Variables:
#   Secrets:
#     AZURE_STATIC_WEB_APPS_API_TOKEN — SWA deployment token (set after first
#                                        infra run, or use Bicep output)
#   Variables (or Secrets):
#     AZURE_CLIENT_ID        — App registration client ID (OIDC federated credential)
#     AZURE_TENANT_ID        — Azure AD tenant ID
#     AZURE_SUBSCRIPTION_ID  — Target Azure subscription
#     AZURE_RG               — Resource group name (e.g. rg-fastestfinger-dev)
#
# OIDC Setup:
#   1. Create an App Registration in Azure AD
#   2. Add a Federated Credential for this repo (subject: repo:<owner>/<repo>:ref:refs/heads/main)
#   3. Grant the App Registration "Contributor" on the resource group
#   4. Store the IDs above as GitHub repo secrets/variables
#
# Production deployment:
#   For a prod environment, add an Environment protection rule in GitHub Settings
#   (Settings → Environments → "production" → Required reviewers) so deploys
#   require manual approval before running.
# =============================================================================

name: Deploy Fastest Finger Quiz

on:
  push:
    branches: [main]
  workflow_dispatch:

# Cancel any in-progress run on the same branch to save resources
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  id-token: write   # Required for OIDC federated credential login
  contents: read

jobs:
  # ===========================================================================
  # Job 1 — Provision Azure Infrastructure (Bicep)
  # ===========================================================================
  infrastructure:
    name: 🏗️ Deploy Infrastructure
    runs-on: ubuntu-latest

    outputs:
      swa-token: ${{ steps.deploy-bicep.outputs.swaToken }}
      swa-hostname: ${{ steps.deploy-bicep.outputs.swaHostname }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy Bicep template
        id: deploy-bicep
        run: |
          DEPLOYMENT_OUTPUT=$(az deployment group create \
            --resource-group "${{ secrets.AZURE_RG }}" \
            --template-file infra/main.bicep \
            --parameters infra/main.bicepparam \
            --query 'properties.outputs' \
            --output json)

          # Extract outputs for downstream jobs
          SWA_TOKEN=$(echo "$DEPLOYMENT_OUTPUT" | jq -r '.staticWebAppDeploymentToken.value')
          SWA_HOSTNAME=$(echo "$DEPLOYMENT_OUTPUT" | jq -r '.staticWebAppHostname.value')

          # Mask the deployment token so it doesn't appear in logs
          echo "::add-mask::$SWA_TOKEN"

          echo "swaToken=$SWA_TOKEN" >> "$GITHUB_OUTPUT"
          echo "swaHostname=$SWA_HOSTNAME" >> "$GITHUB_OUTPUT"

          echo "✅ Infrastructure deployed — SWA hostname: $SWA_HOSTNAME"

  # ===========================================================================
  # Job 2 — Build, Test & Deploy Application
  # ===========================================================================
  build-and-deploy:
    name: 🚀 Build, Test & Deploy
    runs-on: ubuntu-latest
    needs: infrastructure

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            src/frontend/package-lock.json
            src/api/package-lock.json

      # --- Frontend ---
      - name: Install frontend dependencies
        run: npm install --no-audit --no-fund
        working-directory: src/frontend

      - name: Build frontend
        run: npm run build
        working-directory: src/frontend

      - name: Test frontend
        run: npm test --if-present
        working-directory: src/frontend
        continue-on-error: true

      # --- Backend (API) ---
      - name: Install API dependencies
        run: npm install --no-audit --no-fund
        working-directory: src/api

      - name: Build API
        run: npm run build
        working-directory: src/api

      - name: Test API
        run: npm test --if-present
        working-directory: src/api
        continue-on-error: true

      # --- Deploy to Azure Static Web Apps ---
      # Uses the SWA token from the Bicep deployment output.
      # Fallback: if the secret AZURE_STATIC_WEB_APPS_API_TOKEN is set,
      # it takes precedence (useful when infra is already provisioned).
      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN || needs.infrastructure.outputs.swa-token }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: src/frontend
          api_location: src/api
          output_location: dist
