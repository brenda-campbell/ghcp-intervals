# =============================================================================
# Fastest Finger Quiz — CI/CD Pipeline
# =============================================================================
# Required GitHub Repository Secrets:
#     AZURE_CLIENT_ID        — App registration client ID (OIDC + Cosmos auth)
#     AZURE_CLIENT_SECRET    — App registration client secret (Cosmos AAD auth)
#     AZURE_TENANT_ID        — Azure AD tenant ID
#     AZURE_SUBSCRIPTION_ID  — Target Azure subscription
#     AZURE_RG               — Resource group name (e.g. rg-fastestfinger-dev)
#     AZURE_STATIC_WEB_APPS_API_TOKEN — (optional) SWA deployment token override
# =============================================================================

name: Deploy Fastest Finger Quiz

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  id-token: write
  contents: read

jobs:
  # ===========================================================================
  # Job 1 — Provision Azure Infrastructure (Bicep)
  # ===========================================================================
  infrastructure:
    name: 🏗️ Deploy Infrastructure
    runs-on: ubuntu-latest

    outputs:
      swa-hostname: ${{ steps.swa-info.outputs.swaHostname }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy Bicep template
        id: deploy-bicep
        run: |
          DEPLOYMENT_OUTPUT=$(az deployment group create \
            --resource-group "${{ secrets.AZURE_RG }}" \
            --template-file infra/main.bicep \
            --parameters infra/main.bicepparam \
            --query 'properties.outputs' \
            --output json)

          COSMOS_ENDPOINT=$(echo "$DEPLOYMENT_OUTPUT" | jq -r '.cosmosDbEndpoint.value')
          SIGNALR_CONN=$(echo "$DEPLOYMENT_OUTPUT" | jq -r '.signalRConnectionString.value')
          echo "::add-mask::$SIGNALR_CONN"

          echo "cosmosEndpoint=$COSMOS_ENDPOINT" >> "$GITHUB_OUTPUT"
          echo "signalrConn=$SIGNALR_CONN" >> "$GITHUB_OUTPUT"

          echo "✅ Infrastructure deployed"

      # SWA config is separate from Bicep while the ARM lock clears
      - name: Configure SWA app settings
        id: swa-info
        run: |
          SWA_NAME="fastestfinger-dev-swa"

          SWA_HOSTNAME=$(az staticwebapp show \
            --name "$SWA_NAME" \
            --resource-group "${{ secrets.AZURE_RG }}" \
            --query defaultHostname -o tsv)
          echo "swaHostname=$SWA_HOSTNAME" >> "$GITHUB_OUTPUT"

          az staticwebapp appsettings set \
            --name "$SWA_NAME" \
            --setting-names \
              COSMOS_ENDPOINT="${{ steps.deploy-bicep.outputs.cosmosEndpoint }}" \
              AzureSignalRConnectionString="${{ steps.deploy-bicep.outputs.signalrConn }}" \
              AZURE_CLIENT_ID="${{ secrets.AZURE_CLIENT_ID }}" \
              AZURE_CLIENT_SECRET="${{ secrets.AZURE_CLIENT_SECRET }}" \
              AZURE_TENANT_ID="${{ secrets.AZURE_TENANT_ID }}" \
            > /dev/null

          echo "✅ SWA configured — $SWA_HOSTNAME"
        continue-on-error: true

  # ===========================================================================
  # Job 2 — Build, Test & Deploy Application
  # ===========================================================================
  build-and-deploy:
    name: 🚀 Build, Test & Deploy
    runs-on: ubuntu-latest
    needs: infrastructure

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            src/frontend/package-lock.json
            src/api/package-lock.json

      # --- Frontend ---
      - name: Install frontend dependencies
        run: npm install --no-audit --no-fund
        working-directory: src/frontend

      - name: Build frontend
        run: npm run build
        working-directory: src/frontend

      - name: Test frontend
        run: npm test --if-present
        working-directory: src/frontend
        continue-on-error: true

      # --- Backend (API) ---
      - name: Install API dependencies
        run: npm install --no-audit --no-fund
        working-directory: src/api

      - name: Build API
        run: npm run build
        working-directory: src/api

      - name: Test API
        run: npm test --if-present
        working-directory: src/api
        continue-on-error: true

      # --- Deploy to Azure Static Web Apps ---
      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: src/frontend
          api_location: src/api
          output_location: dist
